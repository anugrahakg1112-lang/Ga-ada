<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DANCOGEMING | Official</title>

<meta name="description" content="Halaman resmi DANCOGEMING - Gaming, Content & Community">
<meta name="theme-color" content="#ff0000">

<style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 25px 15px;

    color: white;

    background:
        linear-gradient(
            rgba(0,0,0,.58),
            rgba(0,0,0,.90)
        ),
        url("746657.png");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    overflow-x: hidden;
}


/* =========================
   BACKGROUND
========================= */

.background {
    position: fixed;
    inset: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: 0;
}

.glow {
    position: absolute;

    width: 280px;
    height: 280px;

    border-radius: 50%;

    background: red;

    filter: blur(110px);

    opacity: .18;

    animation: glowMove 7s infinite alternate ease-in-out;
}

.glow.one {
    top: -100px;
    left: -100px;
}

.glow.two {
    bottom: -120px;
    right: -100px;

    animation-delay: 2s;
}

@keyframes glowMove {

    0% {
        transform: translate(0,0) scale(1);
    }

    50% {
        transform: translate(100px,80px) scale(1.2);
    }

    100% {
        transform: translate(-50px,150px) scale(.9);
    }
}


/* =========================
   PARTICLES
========================= */

.particles span {

    position: absolute;

    display: block;

    width: 4px;
    height: 4px;

    background: #ff2020;

    border-radius: 50%;

    box-shadow:
        0 0 10px red,
        0 0 20px red;

    opacity: .7;

    animation: particleFloat linear infinite;
}

.particles span:nth-child(1) {
    left: 10%;
    animation-duration: 8s;
    animation-delay: 1s;
}

.particles span:nth-child(2) {
    left: 25%;
    animation-duration: 11s;
    animation-delay: 3s;
}

.particles span:nth-child(3) {
    left: 40%;
    animation-duration: 9s;
    animation-delay: 2s;
}

.particles span:nth-child(4) {
    left: 55%;
    animation-duration: 13s;
    animation-delay: 4s;
}

.particles span:nth-child(5) {
    left: 70%;
    animation-duration: 10s;
    animation-delay: 1s;
}

.particles span:nth-child(6) {
    left: 85%;
    animation-duration: 12s;
    animation-delay: 5s;
}

@keyframes particleFloat {

    from {
        transform:
            translateY(110vh)
            scale(.5);

        opacity: 0;
    }

    20% {
        opacity: .8;
    }

    80% {
        opacity: .8;
    }

    to {
        transform:
            translateY(-20vh)
            scale(1.4);

        opacity: 0;
    }
}


/* =========================
   MAIN
========================= */

.container {

    width: 100%;
    max-width: 450px;

    position: relative;

    z-index: 2;
}


/* =========================
   CARD
========================= */

.card {

    position: relative;

    padding: 35px 23px 25px;

    text-align: center;

    border-radius: 30px;

    background:
        linear-gradient(
            145deg,
            rgba(25,25,25,.82),
            rgba(0,0,0,.68)
        );

    border:
        1px solid rgba(255,0,0,.35);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:

        0 0 20px rgba(255,0,0,.15),

        0 0 70px rgba(255,0,0,.08),

        0 30px 80px rgba(0,0,0,.8);

    animation: cardIn 1s cubic-bezier(.17,.67,.32,1.2);

    overflow: hidden;
}


/* garis neon atas */

.card::before {

    content: "";

    position: absolute;

    top: 0;
    left: 8%;

    width: 84%;
    height: 2px;

    background: linear-gradient(
        90deg,
        transparent,
        red,
        #ff5555,
        red,
        transparent
    );

    box-shadow:
        0 0 15px red,
        0 0 30px red;

    animation: lineMove 3s infinite;
}

@keyframes lineMove {

    0% {
        opacity: .3;
        transform: scaleX(.5);
    }

    50% {
        opacity: 1;
        transform: scaleX(1);
    }

    100% {
        opacity: .3;
        transform: scaleX(.5);
    }
}

@keyframes cardIn {

    from {
        opacity: 0;

        transform:
            translateY(50px)
            scale(.85);
    }

    to {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================
   LOGO
========================= */

.logo-wrapper {

    width: 120px;
    height: 120px;

    margin: auto;

    display: flex;

    justify-content: center;
    align-items: center;

    position: relative;
}


/* lingkaran glow */

.logo-wrapper::before {

    content: "";

    position: absolute;

    inset: -7px;

    border-radius: 50%;

    border:
        2px solid rgba(255,0,0,.7);

    box-shadow:
        0 0 15px red,
        0 0 35px rgba(255,0,0,.6),
        inset 0 0 20px rgba(255,0,0,.3);

    animation: logoRing 2.5s infinite linear;
}

@keyframes logoRing {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

.logo {

    width: 105px;
    height: 105px;

    object-fit: cover;

    border-radius: 50%;

    border: 3px solid #ff1717;

    box-shadow:
        0 0 15px red,
        0 0 40px rgba(255,0,0,.55);

    animation: logoFloat 3s infinite ease-in-out;

    position: relative;

    z-index: 2;
}

@keyframes logoFloat {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}


/* =========================
   NAME
========================= */

h1 {

    margin-top: 20px;

    font-size: 29px;

    letter-spacing: 1px;

    text-shadow:
        0 0 8px red,
        0 0 20px rgba(255,0,0,.5);

    animation: textGlow 2s infinite alternate;
}

@keyframes textGlow {

    from {
        text-shadow:
            0 0 7px red;
    }

    to {
        text-shadow:
            0 0 10px red,
            0 0 25px red;
    }
}

.verified {

    display: inline-flex;

    justify-content: center;
    align-items: center;

    width: 21px;
    height: 21px;

    margin-left: 4px;

    border-radius: 50%;

    background: #ff1717;

    color: white;

    font-size: 14px;

    box-shadow:
        0 0 10px red;
}


/* =========================
   USERNAME
========================= */

.username {

    margin-top: 8px;

    color: #ff6868;

    font-size: 14px;

    letter-spacing: .5px;
}


/* =========================
   LINE
========================= */

.line {

    width: 80px;
    height: 3px;

    margin: 20px auto;

    background: red;

    border-radius: 20px;

    box-shadow:
        0 0 10px red,
        0 0 25px red;

    animation: linePulse 2s infinite alternate;
}

@keyframes linePulse {

    from {
        width: 55px;
        opacity: .6;
    }

    to {
        width: 100px;
        opacity: 1;
    }
}


/* =========================
   BIO
========================= */

.bio {

    margin:

        0 auto 27px;

    max-width: 350px;

    color: #ddd;

    font-size: 15px;

    line-height: 1.7;
}


/* =========================
   STATUS
========================= */

.status {

    display: inline-flex;

    align-items: center;

    gap: 8px;

    margin-bottom: 20px;

    padding: 7px 14px;

    border-radius: 30px;

    background:
        rgba(255,0,0,.08);

    border:
        1px solid rgba(255,0,0,.25);

    color: #ff8888;

    font-size: 12px;
}

.status-dot {

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #ff2020;

    box-shadow:
        0 0 8px red,
        0 0 15px red;

    animation: statusPulse 1.3s infinite;
}

@keyframes statusPulse {

    0%,100% {
        transform: scale(1);
        opacity: 1;
    }

    50% {
        transform: scale(1.5);
        opacity: .5;
    }
}


/* =========================
   LINK BUTTON
========================= */

.links {

    width: 100%;
}

.link {

    position: relative;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 12px;

    width: 100%;

    padding: 18px;

    border-radius: 18px;

    color: white;

    text-decoration: none;

    font-size: 16px;

    font-weight: bold;

    background:
        linear-gradient(
            135deg,
            rgba(37,211,102,.30),
            rgba(0,90,45,.18)
        );

    border:
        1px solid rgba(37,211,102,.5);

    box-shadow:
        0 0 15px rgba(37,211,102,.12);

    overflow: hidden;

    transition:
        transform .25s,
        box-shadow .25s,
        border-color .25s;

    animation:
        buttonIn
        1s
        .5s
        both;
}

@keyframes buttonIn {

    from {
        opacity: 0;
        transform: translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* efek cahaya tombol */

.link::before {

    content: "";

    position: absolute;

    top: 0;
    left: -120%;

    width: 70%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.25),
            transparent
        );

    transform: skewX(-25deg);

    animation: shine 3s infinite;
}

@keyframes shine {

    0% {
        left: -120%;
    }

    45%,
    100% {
        left: 140%;
    }
}

.link:hover {

    transform:
        translateY(-4px)
        scale(1.02);

    border-color: #25d366;

    box-shadow:
        0 0 20px rgba(37,211,102,.3),
        0 10px 30px rgba(0,0,0,.4);
}

.link:active {

    transform:
        scale(.95);
}

.icon {

    font-size: 25px;

    filter:
        drop-shadow(
            0 0 5px rgba(255,255,255,.5)
        );
}


/* =========================
   FOOTER
========================= */

.footer {

    margin-top: 27px;

    color: #777;

    font-size: 12px;

    line-height: 1.6;
}

.footer strong {

    color: #aaa;
}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 400px) {

    body {
        padding: 15px 10px;
    }

        padding:
            30px 17px 23px;
    }

    .logo-wrapper {

        height: 105px;

    .logo {
        width: 92px;
        height: 92px;
    }

    h1 {
        font-size: 24px;
    }

    .bio {
        font-size: 14px;
    }

    .link {
        padding: 16px;
    }
}

</style>
