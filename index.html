<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GoblokGaming</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;

    color: white;

    background:
        linear-gradient(
            rgba(0,0,0,0.45),
            rgba(0,0,0,0.80)
        ),
        url("746657.png");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    overflow-x: hidden;
}

/* Cahaya merah */

body::before {
    content: "";
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at center,
            transparent 20%,
            rgba(0,0,0,0.5)
        );

    pointer-events: none;
}

/* Cahaya bergerak */

.red-glow {
    position: fixed;

    width: 250px;
    height: 250px;

    border-radius: 50%;

    background: red;

    filter: blur(120px);

    opacity: 0.18;

    top: -100px;
    right: -80px;

    animation: glowMove 5s infinite alternate;
}

@keyframes glowMove {

    from {
        transform: translate(0,0);
    }

    to {
        transform: translate(-100px,120px);
    }
}

/* Container */

.container {
    width: 100%;
    max-width: 430px;

    position: relative;
    z-index: 2;
}

/* Kartu */

.card {
    padding: 32px 22px;

    text-align: center;

    border-radius: 28px;

    background: rgba(0,0,0,0.60);

    border: 1px solid rgba(255,0,0,0.35);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    box-shadow:
        0 0 35px rgba(255,0,0,0.20),
        0 25px 70px rgba(0,0,0,0.7);

    animation: cardIn 0.8s ease;
}

@keyframes cardIn {

    from {
        opacity: 0;
        transform: scale(0.85);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* Logo */

.logo {
    width: 105px;
    height: 105px;

    object-fit: cover;

    border-radius: 50%;

    border: 3px solid red;

    box-shadow:
        0 0 15px red,
        0 0 35px rgba(255,0,0,0.6);

    animation: logoFloat 3s infinite ease-in-out;
}

@keyframes logoFloat {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}

/* Nama */

h1 {
    margin-top: 18px;

    font-size: 28px;

    text-shadow:
        0 0 10px red;
}

.username {
    margin-top: 7px;

    color: #ff5555;

    font-size: 14px;
}

.bio {
    margin-top: 18px;
    margin-bottom: 25px;

    color: #ddd;

    font-size: 14px;

    line-height: 1.6;
}

/* Garis */

.line {
    width: 70px;
    height: 3px;

    margin: 18px auto;

    background: red;

    border-radius: 10px;

    box-shadow:
        0 0 12px red;
}

/* ========================= */
/* LINK WHATSAPP JATUH */
/* ========================= */

.links {
    width: 100%;
}

/* Tombol */

.link {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 12px;

    width: 100%;

    padding: 17px;

    border-radius: 17px;

    color: white;

    text-decoration: none;

    font-weight: bold;

    background:
        linear-gradient(
            135deg,
            rgba(37,211,102,0.30),
            rgba(0,80,40,0.20)
        );

    border: 1px solid rgba(37,211,102,0.45);

    box-shadow:
        0 0 15px rgba(37,211,102,0.15);

    /* JATUH DARI ATAS */

    opacity: 0;

    animation:
        linkDrop
        1.5s
        cubic-bezier(.17,.67,.32,1.4)
        0.5s
        forwards;

    transition: 0.25s;
}

/* Animasi jatuh */

@keyframes linkDrop {

    0% {
        opacity: 0;

        transform:
            translateY(-500px)
            rotate(-12deg)
            scale(0.8);
    }

    45% {
        opacity: 1;

        transform:
            translateY(30px)
            rotate(5deg)
            scale(1.05);
    }

    65% {

        transform:
            translateY(-15px)
            rotate(-2deg)
            scale(0.98);
    }

    80% {

        transform:
            translateY(7px)
            rotate(1deg)
            scale(1.01);
    }

    100% {
        opacity: 1;

        transform:
            translateY(0)
            rotate(0)
            scale(1);
    }
}

/* Saat disentuh */

.link:hover {

    transform: scale(1.03);

    border-color: #25d366;

    box-shadow:
        0 0 25px rgba(37,211,102,0.45);
}

.link:active {

    transform: scale(0.95);
}

.icon {
    font-size: 24px;
}

/* Footer */

.footer {
    margin-top: 25px;

    color: #888;

    font-size: 12px;
}

.verified {
    color: #ff3333;

    text-shadow:
        0 0 8px red;
}

/* HP kecil */

@media (max-width:400px) {

    .card {
        padding: 28px 18px;
    }

    .logo {
        width: 90px;
        height: 90px;
    }

    h1 {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<div class="red-glow"></div>

<div class="container">

    <div class="card">

        <!-- LOGO -->
        <img
            class="logo"
            src="746657.png"
            alt="DANCOGEMING"
        >

        <!-- NAMA -->
        <h1>
            DANCOGEMING
            <span class="verified">✓</span>
        </h1>

        <div class="username">
            @DANCOGEMING
        </div>

        <div class="line"></div>

        <!-- BIO -->
        <p class="bio">
            🎮 Gaming • Content • Community
            <br>
            Selamat datang di halaman resmi DANCOGEMING!
        </p>

        <!-- LINK -->
        <div class="links">

            <a
                class="link"
                href="https://chat.whatsapp.com/JsQde6f8PjZK9kYAoqGp7k"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="icon">💬</span>

                <span>
                    Gabung Grup WhatsApp
                </span>

            </a>

        </div>

        <div class="footer">
            © 2026 DANCOGEMING
        </div>

    </div>

</div>

</body>
</html>
